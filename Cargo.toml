[workspace]
members = ["."]
exclude = ["tools/generate-bench-data"]

[package]
name = "geotiff-to-pmtiles"
version = "0.0.12"
edition = "2024"
repository = "https://github.com/yutannihilation/geotiff-to-pmtiles"
autobins = false

[[bin]]
name = "geotiff-to-pmtiles"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
tiff = "0.11"
png = "0.17.16"
pmtiles = { version = "0.21.0", default-features = false, features = ["write"] }
proj-lite = { git = "https://github.com/yutannihilation/proj-rs-lite.git", rev = "15455f3813da307683e8619f88f09e9e5943fd1c", version = "0.1.0" }
ravif = "0.13.0"
rgb = { version = "0.8.52", features = ["bytemuck"] }
rayon = "1.11.0"
glob = "0.3.2"

[package.metadata.release]
tag = true # create a single tag for the version (e.g. "v0.2.5")
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "Unreleased", replace = "v{{version}}", min = 1 },
    { file = "CHANGELOG.md", search = "\\.\\.\\.HEAD", replace = "...{{tag_name}}", exactly = 1 },
    { file = "CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## [Unreleased] (ReleaseDate)\n", exactly = 1 },
    { file = "CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[Unreleased]: https://github.com/yutannihilation/geotiff-to-pmtiles/compare/{{tag_name}}...HEAD", exactly = 1 },
]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
